{% set name = "torchmetrics" %}
{% set version = "1.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a488609948600df52d3db4fcdab02e62aab2a85ef34da67037dc3e65b8512faa

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - numpy >1.20.0
    - packaging >17.1
    - pytorch >=2.0.0
    - lightning-utilities >=0.8.0
  run_constrained:
    # Optional depedencies from torchmetrics/requirements
    # audio
    - pesq >=0.0.4
    - pystoi >=0.4.0
    - torchaudio >=2.0.1
    - gammatone >=1.0.0
    - librosa >=0.10.0
    - onnxruntime >=1.12.0
    - requests >=2.19.0
    # clustering
    - torch_linear_assignment >=0.0.2
    # detection
    - torchvision >=0.15.1
    - pycocotools >2.0.0
    # image
    - scipy >1.0.0
    #- torchvision >=0.15.1 -> already in the detection section
    # multimodal
    - transformers >=4.43.0
    - einops >=0.7.0
    - timm >=0.9.0
    # text
    - nltk >3.8.1
    - regex >=2021.9.24
    #- transformers >=4.43.0 -> already in the multimodal section
    - mecab-python3 >=1.0.6
    - ipadic >=1.0.0
    - sentencepiece >=0.2.0
    # video
    - vmaf-torch >=1.1.0,<1.2.0
    #- einops >=0.7.0,<0.9.0 -> already in the multimodal section
    # visual
    - matplotlib-base >=3.6.0
    - scienceplots >= 2.0.0

test:
  imports:
    - torchmetrics
    - torchmetrics.aggregation
    - torchmetrics.audio
    - torchmetrics.classification
    - torchmetrics.clustering
    - torchmetrics.collections
    - torchmetrics.detection
    - torchmetrics.functional
    - torchmetrics.image
    - torchmetrics.metric
    - torchmetrics.multimodal
    - torchmetrics.nominal
    - torchmetrics.regression
    - torchmetrics.retrieval
    - torchmetrics.segmentation
    - torchmetrics.shape
    - torchmetrics.text
    - torchmetrics.utilities
    - torchmetrics.utilities
    - torchmetrics.wrappers
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/torchmetrics
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Collection of PyTorch native metrics for easy evaluating machine learning models
  description: |
    Torchmetrics is a metrics API created for easy metric development and usage in both PyTorch and
    [PyTorch Lightning](https://pytorch-lightning.readthedocs.io/en/stable/). It was originally a part of
    Pytorch Lightning, but got split off so users could take advantage of the large collection of metrics
    implemented without having to install Pytorch Lightning (even though we would love for you to try it out).
    We currently have around 25+ metrics implemented and we continuously is adding more metrics, both within
    already covered domains (classification, regression ect.) but also new domains (object detection ect.).
    We make sure that all our metrics are rigorously tested such that you can trust them.
  doc_url: https://torchmetrics.readthedocs.io
  dev_url: https://github.com/PyTorchLightning/metrics

extra:
  recipe-maintainers:
    - Borda
    - williamFalcon
